services:
  db:
    image: postgres:16 
    container_name: maori_story_postgres
    environment:
      - POSTGRES_DB=maori_story_demo_postgres      # db name
      - POSTGRES_USER=demo_admin       # db user 
      - POSTGRES_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in a private environment file}
    ports:
      - "5432:5432" 
    volumes:
      - postgres_data:/var/lib/postgresql/data/

volumes:
  postgres_data: