# /frontend/nginx.conf
server {
    listen 80;
    server_name localhost;

    sendfile off;
    aio off;
    
    root /usr/share/nginx/html;
    index index.html index.htm;

    location = / {
        return 302 /story-filler/;
    }

    location = /story-filler {
        return 302 /story-filler/;
    }

    location /story-filler/ {
        try_files $uri $uri/ /story-filler/index.html;
    }

    # Missing assets should be a 404 rather than the SPA HTML fallback.
    location /story-filler/assets/ {
        try_files $uri =404;
    }

    location / {
        return 404;
    }

    location ~ /\.ht {
        deny all;
    }
}
