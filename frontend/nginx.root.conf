# Internal Compose frontend: the outer proxy has removed /story-filler/.
server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Missing build assets must not return the application HTML.
    location /assets/ {
        try_files $uri =404;
    }

    # React Router handles story routes after this static entry point loads.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
