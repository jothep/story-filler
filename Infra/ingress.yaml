# ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: maori-story-ingress
  namespace: story-fill
  annotations:
    # This rewrite rule REQUIRES the regex paths below
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  rules:
  - http:
      paths:
      # Rule 1: /api/ -> backend
      - path: /api(/|$)(.*)
        # Use ImplementationSpecific for regex
        pathType: ImplementationSpecific
        backend:
          service:
            name: maori-story-backend-svc
            port:
              number: 80
      
      # Rule 2: / -> frontend
      - path: /(.*)
        # Use ImplementationSpecific for regex
        pathType: ImplementationSpecific
        backend:
          service:
            name: maori-story-frontend-svc
            port:
              number: 80