# docker-compose.minio.yml
# MinIO - Self-hosted S3-compatible object storage
#
# Usage:
#   docker-compose -f docker-compose.minio.yml up -d
#
# Access:
#   MinIO API:     http://localhost:9000
#   MinIO Console: http://localhost:9001
#   Credentials:   REMOVED_CREDENTIAL / REMOVED_CREDENTIAL

version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: maori-story-minio
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # Web Console
    environment:
      MINIO_ROOT_USER: REMOVED_CREDENTIAL
      MINIO_ROOT_PASSWORD: REMOVED_CREDENTIAL
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - story-network

  # Optional: MinIO Client (mc) for bucket creation
  minio-init:
    image: minio/mc:latest
    container_name: maori-story-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set myminio http://minio:9000 REMOVED_CREDENTIAL REMOVED_CREDENTIAL;
      /usr/bin/mc mb myminio/maori-story --ignore-existing;
      /usr/bin/mc anonymous set download myminio/maori-story;
      echo 'Bucket maori-story created and configured';
      "
    networks:
      - story-network

volumes:
  minio_data:
    driver: local

networks:
  story-network:
    driver: bridge
