name: CodeQL Security Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scans:
    name: Source security
    uses: ./.github/workflows/security-checks.yml
    permissions:
      contents: read
      actions: read
      security-events: write

  gate:
    name: Security Gate
    if: always()
    needs: scans
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require successful security checks
        env:
          SCAN_RESULT: ${{ needs.scans.result }}
        run: test "$SCAN_RESULT" = success
