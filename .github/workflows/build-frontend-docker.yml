name: Build Frontend Docker Image (Manual)

on:
  workflow_dispatch:  # 仅手动触发
    inputs:
      push_to_registry:
        description: 'Push image to Docker Hub'
        required: false
        type: boolean
        default: false

jobs:
  build-and-scan:
    name: Build and Scan Frontend Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 3. Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 4. Run Linter
        working-directory: ./frontend
        run: npm run lint

      - name: 5. Run Tests
        working-directory: ./frontend
        run: npm test -- run

      - name: 6. Build Docker image
        working-directory: ./frontend
        run: |
          docker build -f Dockerfile.nginx -t maori-story-frontend:local .

      - name: 7. Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: maori-story-frontend:local
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true

      - name: 8. Login to Docker Hub (if push enabled)
        if: ${{ inputs.push_to_registry }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 9. Tag and Push to Docker Hub (if push enabled)
        if: ${{ inputs.push_to_registry }}
        run: |
          docker tag maori-story-frontend:local ${{ secrets.DOCKERHUB_USERNAME }}/maori-story-frontend:latest
          docker tag maori-story-frontend:local ${{ secrets.DOCKERHUB_USERNAME }}/maori-story-frontend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/maori-story-frontend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/maori-story-frontend:${{ github.sha }}
