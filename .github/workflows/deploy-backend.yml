name: Deploy Backend to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
      # Exclude documentation files only
      - '!backend/**/*.md'
      - '!backend/.gitignore'
  workflow_dispatch:  # 允许手动触发

env:
  GCP_REGION: us-central1
  GCP_PROJECT_ID: jaskojothep
  ARTIFACT_REGISTRY: maori-story
  SERVICE_NAME: maori-story-backend

jobs:
  test-and-deploy:
    name: Test, Build, Scan and Deploy to Cloud Run
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      # ==================== Code Quality & Testing ====================
      - name: 1. Checkout code
        uses: actions/checkout@v4

      - name: 2. Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: 3. Install dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt

      - name: 4. Run Flake8 (Code style check)
        working-directory: ./backend
        run: flake8 . --count --show-source --statistics --max-line-length=120 --exclude=migrations
        continue-on-error: true  # Don't fail on style issues

      - name: 5. Run Pylint (Static code analysis)
        working-directory: ./backend
        run: |
          pylint --fail-under=7.0 --max-line-length=120 --disable=C0114,C0115,C0116 $(git ls-files '*.py' | grep -v migrations)
        continue-on-error: true  # Don't fail on linting issues

      - name: 6. Run tests
        working-directory: ./backend
        run: python manage.py test
        env:
          SECRET_KEY: 'REMOVED_CREDENTIAL'
          DATABASE_URL: 'sqlite:///:memory:'

      # ==================== Docker Build & Push ====================
      - name: 7. Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: 8. Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: 9. Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

      - name: 10. Build Docker image
        run: |
          cd backend
          docker build \
            -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY }}/backend:${{ github.sha }} \
            -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY }}/backend:latest \
            .

      - name: 11. Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY }}/backend:latest
          format: 'table'
          exit-code: '1'  # Fail build if HIGH or CRITICAL vulnerabilities found
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true  # Only fail on vulnerabilities that have fixes available

      - name: 12. Push Docker image
        run: |
          docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY }}/backend:${{ github.sha }}
          docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY }}/backend:latest

      # ==================== Deploy to Cloud Run ====================
      - name: 13. Deploy new image to Cloud Run
        run: |
          gcloud run services update ${{ env.SERVICE_NAME }} \
            --region=${{ env.GCP_REGION }} \
            --image=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY }}/backend:${{ github.sha }}

      - name: 14. Show service URL
        run: |
          gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.GCP_REGION }} \
            --format='value(status.url)'
