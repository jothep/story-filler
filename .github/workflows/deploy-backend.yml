name: Deploy Backend to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
      - 'scripts/**'
      - 'terraform/**'
      - 'pyproject.toml'
      - '.flake8'
      - '.pylintrc'
      - '!backend/**/*.md'
      - '!backend/.gitignore'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GCP_REGION: us-central1
  GCP_PROJECT_ID: jaskojothep
  ARTIFACT_REGISTRY: maori-story
  SERVICE_NAME: maori-story-backend

jobs:
  security:
    name: Release security
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: ./.github/workflows/codeql-analysis.yml
    permissions:
      contents: read
      actions: read
      security-events: write

  test:
    name: Test backend and maintenance scripts
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.scope.outputs.release }}
    # Synthetic data only; Django creates and removes its own test database.
    services:
      postgres:
        image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env:
          POSTGRES_USER: backend_test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: backend_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U backend_test -d backend_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout source and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Identify changes that need an application release
        id: scope
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          python - <<'PY'
          import os
          import subprocess

          event = os.environ['GITHUB_EVENT_NAME']
          release = event == 'workflow_dispatch'
          if event == 'push':
              before = os.environ['BEFORE_SHA']
              after = os.environ['GITHUB_SHA']
              if before and before != '0' * 40:
                  command = ['git', 'diff', '--name-only', before, after]
              else:
                  command = ['git', 'diff-tree', '--root', '--no-commit-id', '--name-only', '-r', after]
              paths = subprocess.check_output(command, text=True).splitlines()
              release_files = {
                  '.github/workflows/deploy-backend.yml',
                  'scripts/cloud_run_release.py',
                  'scripts/smoke-check.py',
              }
              release = any(
                  path in release_files or (
                      path.startswith('backend/')
                      and not path.endswith('.md')
                      and path != 'backend/.gitignore'
                  )
                  for path in paths
              )
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'release={str(release).lower()}\n')
          PY

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install locked test dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r backend/requirements-dev.txt
          python -m pip check

      - name: Audit locked runtime dependencies
        # Audit every locked package, including packages preinstalled by pip-audit.
        shell: bash
        run: |
          python -m pip_audit --strict --require-hashes --disable-pip \
            -r backend/requirements.txt --format json \
            | tee "$RUNNER_TEMP/runtime-audit.json"
          python scripts/check_dependency_audit.py \
            backend/requirements.txt "$RUNNER_TEMP/runtime-audit.json"

      - name: Audit locked development and test dependencies
        shell: bash
        run: |
          python -m pip_audit --strict --require-hashes --disable-pip \
            -r backend/requirements-dev.txt --format json \
            | tee "$RUNNER_TEMP/development-audit.json"
          python scripts/check_dependency_audit.py \
            backend/requirements-dev.txt "$RUNNER_TEMP/development-audit.json"

      - name: Audit locked image-build dependencies
        shell: bash
        run: |
          python -m pip_audit --strict --require-hashes --disable-pip \
            -r backend/requirements-build.txt --format json \
            | tee "$RUNNER_TEMP/build-audit.json"
          python scripts/check_dependency_audit.py \
            backend/requirements-build.txt "$RUNNER_TEMP/build-audit.json"

      - name: Check Python formatting and style
        run: |
          black --check backend scripts demo/polls
          flake8 backend scripts demo/polls

      - name: Analyze backend code with Django support
        working-directory: backend
        env:
          DATABASE_URL: 'postgresql://lint:lint@127.0.0.1:1/lint?connect_timeout=1'
          USE_GCS: 'false'
          USE_S3: 'false'
          DEBUG: 'false'
        run: |
          export SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')"
          python -m pylint --rcfile=../.pylintrc core maori_story_project manage.py change_admin_password.py

      - name: Test the backend with PostgreSQL
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://backend_test:local-test-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/backend_test"
          USE_GCS: 'false'
          USE_S3: 'false'
          DEBUG: 'false'
        run: |
          export SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')"
          python manage.py test --noinput
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Check historical demo response safety without database access
        run: python scripts/check_demo_security.py

      - name: Test maintenance and release checks without cloud access
        run: python -m unittest discover -s scripts -p '*_test.py'

  build-scan:
    name: Verify the candidate image; publish from main
    needs: [test, security]
    # PRs have their own required Security Gate. Main publication waits for a
    # fresh scan of this exact commit before any registry credentials are used.
    if: >-
      !cancelled() && needs.test.result == 'success' &&
      (github.event_name == 'pull_request' ||
       (github.ref == 'refs/heads/main' && needs.security.result == 'success' &&
        needs.test.outputs.release == 'true'))
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.publish.outputs.image }}
      repository: ${{ steps.image.outputs.repository }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Identify a documentation-only pull request
        id: scope
        run: python3 scripts/check_docs_only.py

      - name: Name the candidate image
        if: steps.scope.outputs.docs_only != 'true'
        id: image
        run: |
          repository="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REGISTRY}/backend"
          tag="${repository}:${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'repository=%s\ntag=%s\n' "$repository" "$tag" >> "$GITHUB_OUTPUT"

      - name: Build once
        if: steps.scope.outputs.docs_only != 'true'
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          docker build \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$IMAGE_TAG" backend

      - name: Verify the runtime and isolated PostgreSQL integration
        if: steps.scope.outputs.docs_only != 'true'
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          postgres_image=$(PYTHONPATH=scripts python -c 'from local_recovery import POSTGRES_IMAGE; print(POSTGRES_IMAGE)')
          docker pull "$postgres_image"
          python scripts/backend_integration.py \
            --docker-host unix:///var/run/docker.sock --image "$IMAGE_TAG"

      - name: Record the complete image scan
        if: steps.scope.outputs.docs_only != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: ${{ steps.image.outputs.tag }}
          scanners: vuln
          format: json
          output: backend-image-scan.json
          list-all-pkgs: true
          ignore-unfixed: false
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '0'

      - name: Save the full package and vulnerability report
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: backend-image-scan-${{ github.run_attempt }}
          path: backend-image-scan.json
          if-no-files-found: error
          retention-days: 30

      # This job has no Google credentials until after the local image scan passes.
      - name: Scan the built image
        if: steps.scope.outputs.docs_only != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          skip-setup-trivy: true
          image-ref: ${{ steps.image.outputs.tag }}
          scanners: vuln,secret
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: false

      - name: Authenticate for registry push
        if: >-
          steps.scope.outputs.docs_only != 'true' &&
          github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        if: >-
          steps.scope.outputs.docs_only != 'true' &&
          github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Push the scanned image and record its digest
        id: publish
        if: >-
          steps.scope.outputs.docs_only != 'true' &&
          github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
        run: |
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker push "$IMAGE_TAG"
          python - <<'PY'
          import json
          import os
          import re
          import subprocess

          raw = subprocess.check_output(
              ['docker', 'image', 'inspect', '--format', '{{json .RepoDigests}}', os.environ['IMAGE_TAG']],
              text=True,
          )
          pattern = re.compile(re.escape(os.environ['IMAGE_REPOSITORY']) + r'@sha256:[0-9a-f]{64}')
          images = [value for value in json.loads(raw) if pattern.fullmatch(value)]
          if len(images) != 1:
              raise SystemExit('Expected one immutable digest for the image just pushed.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'image={images[0]}\n')
          PY

  deploy:
    name: Deploy and verify the selected revision
    needs: [build-scan, security]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # The ancestry check also prevents stale releases; this lock does not imply FIFO.
    concurrency:
      group: cloud-run-maori-story-backend
      cancel-in-progress: false
    env:
      IMAGE: ${{ needs.build-scan.outputs.image }}
      IMAGE_REPOSITORY: ${{ needs.build-scan.outputs.repository }}
    steps:
      - name: Checkout full history for release ordering
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Authenticate for the existing Cloud Run service
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Check the currently serving version before deployment
        id: plan
        run: |
          python scripts/cloud_run_release.py plan \
            --service "$SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --repository "$IMAGE_REPOSITORY" --candidate "$GITHUB_SHA" --image "$IMAGE" \
            >> "$GITHUB_OUTPUT"

      - name: Deploy the scanned digest
        id: rollout
        if: steps.plan.outputs.deploy == 'true'
        run: |
          revision=$(gcloud run services update "$SERVICE_NAME" \
            --project="$GCP_PROJECT_ID" --region="$GCP_REGION" \
            --image="$IMAGE" --update-labels="source_commit=${GITHUB_SHA}" \
            --format='value(status.latestReadyRevisionName)' --quiet)
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"

      - name: Verify the serving revision, source commit and digest
        id: verified
        if: steps.plan.outputs.deploy == 'true'
        env:
          EXPECTED_REVISION: ${{ steps.rollout.outputs.revision }}
        run: |
          python scripts/cloud_run_release.py verify \
            --service "$SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --repository "$IMAGE_REPOSITORY" --candidate "$GITHUB_SHA" --image "$IMAGE" \
            --expected-revision "$EXPECTED_REVISION" >> "$GITHUB_OUTPUT"

      - name: Verify the deployed public API
        if: steps.plan.outputs.deploy == 'true'
        timeout-minutes: 5
        env:
          SERVICE_URL: ${{ steps.verified.outputs.service_url }}
        run: python scripts/smoke-check.py --base-url "$SERVICE_URL"
