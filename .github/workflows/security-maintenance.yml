name: Scheduled security maintenance

on:
  schedule:
    - cron: '17 18 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# This workflow audits current main without cloud credentials or publication.
jobs:
  source:
    name: Source and credential checks
    uses: ./.github/workflows/security-checks.yml
    permissions:
      contents: read
      actions: read
      security-events: write

  python-dependencies:
    name: Audit ${{ matrix.lock }}
    strategy:
      fail-fast: false
      matrix:
        lock: [requirements.txt, requirements-dev.txt, requirements-build.txt]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Install locked audit tools
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r backend/requirements-dev.txt
      - name: Audit every package and verify report coverage
        shell: bash
        env:
          LOCK: ${{ matrix.lock }}
        run: |
          python -m pip_audit --strict --require-hashes --disable-pip \
            -r "backend/$LOCK" --format json | tee "$RUNNER_TEMP/$LOCK.json"
          python scripts/check_dependency_audit.py "backend/$LOCK" "$RUNNER_TEMP/$LOCK.json"
      - name: Keep dependency reports
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: python-audit-${{ matrix.lock }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/requirements*.json
          if-no-files-found: error
          retention-days: 30

  javascript-dependencies:
    name: Audit all JavaScript dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: frontend/.nvmrc
      - run: npm ci
      - run: npm audit
      - run: npm audit --omit=dev

  images:
    name: Scan ${{ matrix.component }} image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            dockerfile: backend/dockerfile
          - component: frontend
            dockerfile: frontend/Dockerfile.nginx
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build the locked application image
        env:
          COMPONENT: ${{ matrix.component }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: docker build --pull --file "$DOCKERFILE" --tag "security-maintenance:$COMPONENT" "$COMPONENT"
      - name: Record all image findings and packages
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.76.1
          image-ref: security-maintenance:${{ matrix.component }}
          scanners: vuln
          format: json
          output: image-scan.json
          list-all-pkgs: true
          ignore-unfixed: false
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '0'
      - name: Keep the complete image report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: image-scan-${{ matrix.component }}-${{ github.run_attempt }}
          path: image-scan.json
          if-no-files-found: error
          retention-days: 30
      - name: Reject high or critical vulnerabilities and exposed secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.76.1
          skip-setup-trivy: true
          image-ref: security-maintenance:${{ matrix.component }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
