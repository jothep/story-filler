# .github/workflows/backend-ci.yml

name: Backend CI - Build, Test, Scan, Push

on:
  push:
    branches:
      - main
    paths:
      # This entire workflow ONLY triggers for changes in backend/**
      - 'backend/**'

jobs:
  build-backend:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v3

      - name: 2. Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: 3. Install Dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt

      #- name: 4. Run Flake8 (Style & Syntax Scan)
      #  working-directory: ./backend
      #  run: flake8 . --count --show-source --statistics

      #- name: 5. Run Pylint (Code Analysis)
      #  working-directory: ./backend
      #  run: |
      #    # Pylint will check all python files and exit with an error if the score is below 8.0
      #    pylint --fail-under=8 $(git ls-files '*.py')

      - name: 6. Run Tests
        working-directory: ./backend
        run: python manage.py test
        env:
          SECRET_KEY: 'REMOVED_CREDENTIAL'
          DATABASE_URL: 'sqlite:///:memory:'

      - name: 7. Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      #- name: Set Short SHA
      #  id: vars
      #  run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      # image will be like ${{ secrets.DOCKERHUB_USERNAME }}/maori-story-backend:${{ steps.vars.outputs.sha_short }}

      - name: 8. Build and Push Backend Image
        id: build-and-push
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/maori-story-backend:v0.2

      - name: 9. Scan Pushed Image (Vulnerability Scan)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/maori-story-backend:v0.2
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true