# .github/workflows/backend-ci.yml

name: Backend CI - Build, Test, Scan, Push

on:
  push:
    branches:
      - main
    paths:
      # This entire workflow ONLY triggers for changes in backend/**
      - 'backend/**'

jobs:
  build-backend:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v3

      - name: 2. Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: 3. Install Dependencies
        working-directory: ./backend
        run: |
          pip install -r requirements.txt
          pip install flake8

      - name: 4. Run Linter (Static Code Scan)
        working-directory: ./backend
        run: flake8 . --count --show-source --statistics

      - name: 5. Run Tests
        working-directory: ./backend
        run: python manage.py test

      - name: 6. Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 7. Build and Push Backend Image
        id: build-be
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-django-app:latest

      - name: 8. Scan Pushed Image (Vulnerability Scan)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.build-be.outputs.tags }}
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'