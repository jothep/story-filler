name: Reusable security checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript, python]
    steps:
      - name: Checkout the exact caller commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Analyze and upload results
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          output: ${{ runner.temp }}/codeql-results
          category: /language:${{ matrix.language }}
          wait-for-processing: true

      - name: Require complete results with no findings
        env:
          REPORT_DIRECTORY: ${{ runner.temp }}/codeql-results
          REPORT_LANGUAGE: ${{ matrix.language }}
        run: >-
          python3 scripts/check_codeql_results.py
          --directory "$REPORT_DIRECTORY" --language "$REPORT_LANGUAGE"

      - name: Keep the analysis report for review
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: codeql-results-${{ matrix.language }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codeql-results/*.sarif
          if-no-files-found: error
          retention-days: 30

  credentials:
    name: Credential history
    uses: ./.github/workflows/secret-scan.yml
    permissions:
      contents: read
