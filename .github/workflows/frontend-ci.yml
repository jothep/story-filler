# .github/workflows/frontend-ci.yml

name: Frontend CI - Build, Test, Scan, Push

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v3

      - name: 2. Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 3. Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 4. Run Linter (Static Code Scan)
        working-directory: ./frontend
        run: npm run lint

      - name: 5. Run Tests
        working-directory: ./frontend
        run: npm test -- run

      - name: 6. Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 7. Build and Push Frontend Image
        id: build-and-push
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.nginx
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/maori-story-frontend:v1

      - name: 8. Scan Pushed Image (Vulnerability Scan)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/maori-story-frontend:v1
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true