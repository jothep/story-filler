name: Pipeline for Maori story fill

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy-local:
    runs-on: self-hosted

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v3

      - name: 2. Try K8s
        run: |
          echo "Show current config"
          kubectl config current-context
          
          echo "Show nodes"
          kubectl get no          
