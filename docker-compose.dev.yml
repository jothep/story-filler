version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: maori-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: maori_story_dev
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: REMOVED_CREDENTIAL
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - maori-dev-network

  # Django Backend (Development)
  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    container_name: maori-dev-backend
    restart: unless-stopped
    command: sh /app/start-dev.sh
    environment:
      - DATABASE_URL=postgresql://devuser:REMOVED_CREDENTIAL@db:5432/maori_story_dev
      - SECRET_KEY=REMOVED_CREDENTIAL
      - DEBUG=True
      - ALLOWED_HOSTS=*
      - CORS_ALLOWED_ORIGINS=http://localhost,http://localhost:80
      - USE_S3=false
      - MEDIA_ROOT=/app/media
    volumes:
      - ./backend:/app
      - media_dev_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    networks:
      - maori-dev-network

  # React Frontend (Development)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: maori-dev-frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - maori-dev-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: maori-dev-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - maori-dev-network

volumes:
  postgres_dev_data:
    driver: local
  media_dev_data:
    driver: local

networks:
  maori-dev-network:
    driver: bridge
